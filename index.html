<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vermittlungssystem">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Vermittlungssystem Josef Altmann</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<div id="loginView" class="login">
  <div class="login-card">
    <div class="brand-mark">JA</div>
    <h1>Vermittlungssystem<br><span>Josef Altmann</span></h1>
    <p class="muted">Zentrale Auftrags- und Provisionsverwaltung</p>
    <form id="loginForm">
      <label>E-Mail<input id="email" type="email" required autocomplete="username"></label>
      <label>Passwort<input id="password" type="password" required autocomplete="current-password"></label>
      <button class="primary" type="submit">Anmelden</button>
      <div id="loginMsg" class="message"></div>
    </form>
  </div>
</div>

<div id="appView" class="hidden">
<header class="topbar">
  <div class="brand"><div class="brand-mark small">JA</div><div><strong>Vermittlungssystem</strong><small>Josef Altmann</small></div></div>
  <div class="top-actions"><span id="userName"></span><button id="logoutBtn" class="ghost">Abmelden</button></div>
</header>
<div class="layout">
<aside class="sidebar">
  <button class="nav active" data-page="dashboard">Dashboard</button>
  <button class="nav" data-page="orders">Aufträge</button>
  <button class="nav" data-page="customers">Kunden</button>
  <button class="nav" data-page="companies">Firmen / Subunternehmer</button>
  <button class="nav" data-page="commissions">Provisionen</button>
  <button class="nav" data-page="reports">Monats- / Jahresabrechnung</button>
  <button class="nav" data-page="google">Google Drive / Sheets</button>
</aside>
<main id="main"></main>
</div>
</div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body>
</html>
